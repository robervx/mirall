<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mirall</title>

    <!-- PWA — spec 028. El <link rel="manifest"> lo inyecta vite-plugin-pwa. -->
    <meta name="theme-color" content="#0b1f33" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mirall" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Tipografía del wordmark de marca — solo para #app-header__name, ver ADR-004 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

    <!-- Layout escritorio/móvil — spec 029. Se fija antes del primer pintado
         para que no haya parpadeo; deteccion-dispositivo.ts lo mantiene en
         sincronía de forma reactiva. -->
    <script>
      (function () {
        try {
          var f = localStorage.getItem('mirall:layout-forzado');
          if (f === 'movil' || f === 'escritorio') {
            document.documentElement.dataset.layout = f;
          } else {
            var m = window.matchMedia('(max-width: 640px) and (pointer: coarse)').matches;
            document.documentElement.dataset.layout = m ? 'movil' : 'escritorio';
          }
        } catch (e) {
          document.documentElement.dataset.layout = 'escritorio';
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
